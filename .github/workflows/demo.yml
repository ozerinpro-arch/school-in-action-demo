name: Demo checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build and start the demo
        run: docker compose -f compose.standalone.yaml up --build --detach --wait
      - name: Check browser workflows
        env:
          DEMO_E2E_RESET: '1'
        run: npm run test:e2e -- tests/demo.spec.ts
      - name: Check role boundaries and restart persistence
        run: |
          python3 scripts/check-persistence.py write "$RUNNER_TEMP/school-marker.json"
          docker compose -f compose.standalone.yaml restart demo
          python3 scripts/check-persistence.py verify "$RUNNER_TEMP/school-marker.json"
      - name: Stop demo
        if: always()
        run: docker compose -f compose.standalone.yaml down
  full-school:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Start the full school
        run: docker compose up --build --detach --wait
      - name: Run native workflow tests inside the image
        run: docker compose exec -T school python -B local-runtime/check.py
      - name: Check browser workflows
        env:
          DEMO_PORT: "5261"
        run: npm run test:e2e -- tests/full-school.spec.ts
      - name: Verify the seeded receipt survives container replacement
        run: |
          before="$(curl -fsS http://127.0.0.1:5261/client/school/api/school/clubs)"
          docker compose up --detach --force-recreate --wait
          after="$(curl -fsS http://127.0.0.1:5261/client/school/api/school/clubs)"
          test "$before" = "$after"
      - name: Print logs
        if: failure()
        run: docker compose logs school
      - name: Stop the test stack
        if: always()
        run: docker compose down
