services:
  school:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEMO_PORT: ${DEMO_PORT:-5261}
    ports:
      - "127.0.0.1:${DEMO_PORT:-5261}:5261"
    volumes:
      - school-data:/tmp/school-demo
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import os; from urllib.request import Request, urlopen; urlopen(Request('http://127.0.0.1:5261/health', headers={'Host': '127.0.0.1:' + os.environ['DEMO_PORT']}), timeout=3).close()"]
      interval: 3s
      timeout: 4s
      retries: 20
volumes:
  school-data:
